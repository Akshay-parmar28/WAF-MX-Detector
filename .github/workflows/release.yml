name: build-windows-exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        shell: pwsh
        run: ./packaging/build.ps1
      - name: Package and hash
        shell: pwsh
        run: |
          Compress-Archive -Path dist/WAFMXDetector -DestinationPath WAFMXDetector-win64.zip
          (Get-FileHash WAFMXDetector-win64.zip -Algorithm SHA256).Hash | Out-File WAFMXDetector-win64.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: WAFMXDetector-win64
          path: |
            WAFMXDetector-win64.zip
            WAFMXDetector-win64.zip.sha256
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WAFMXDetector-win64.zip
            WAFMXDetector-win64.zip.sha256
